<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CaptionBridge</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="v2.css"><script src="ui.js" defer></script></head>
<body>
<main class="app">
  <header class="header"><a class="brand" href="#"><span class="logo" aria-hidden="true">字<span>A</span></span><span>Caption<span class="brand-light">Bridge</span></span></a><select id="locale" class="language" aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></header>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="tabs" role="tablist" aria-label="Translation tools">
    <button id="subtitle-tab" type="button" role="tab" aria-controls="subtitle-panel" aria-selected="true" data-i18n="subtitleTab"></button>
    <button id="page-tab" type="button" role="tab" aria-controls="page-panel" aria-selected="false" data-i18n="pageTab"></button>
  </div>
  <div id="subtitle-panel" role="tabpanel" aria-labelledby="subtitle-tab">
    <section class="video-card" id="video-section"><div class="eyebrow"><span class="live-dot"></span><span data-i18n="video"></span></div><h1 id="video-title"></h1><div class="video-status"><span class="status-pill" id="video-state"></span><span id="cue-count"></span></div><p class="notice" id="video-error" role="status"></p></section>
    <section class="controls">
      <label class="toggle-row"><span><strong data-i18n="enabled"></strong><small data-i18n="enabledHint"></small></span><input id="enabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <div class="fields"><label><span data-i18n="target"></span><select id="target"><option value="zh-Hans" data-i18n="zhName"></option><option value="en" data-i18n="enName"></option><option value="zh-Hant" data-i18n="zhTraditional"></option><option value="ja" data-i18n="jaName"></option><option value="ko" data-i18n="koName"></option><option value="fr" data-i18n="frName"></option><option value="de" data-i18n="deName"></option><option value="es" data-i18n="esName"></option></select></label><label><span data-i18n="source"></span><select id="track"><option value="-1" data-i18n="auto"></option></select></label></div>
      <p class="hint" data-i18n="trackNote"></p>
      <div class="position-row"><p class="hint" data-i18n="dragHint"></p><button id="reset-position" type="button" class="text-button" data-i18n="resetPosition"></button></div>
    </section>
    <section class="download-section"><h2 data-i18n="download"></h2><p class="hint" data-i18n="downloadHint"></p><div class="button-row"><button class="primary" id="download-srt" data-i18n="srt" disabled></button><button class="secondary" id="download-vtt" data-i18n="vtt" disabled></button></div><button class="text-button" id="retry" data-i18n="retry"></button></section>
  </div>
  <section id="page-panel" role="tabpanel" aria-labelledby="page-tab" hidden>
    <div class="page-card"><div class="eyebrow" data-i18n="pageTab"></div><h1 data-i18n="pageTitle"></h1><p id="page-title" class="hint"></p><p class="hint" data-i18n="pageHint"></p></div>
    <div class="page-fields fields"><label><span data-i18n="target"></span><select id="page-target"><option value="zh-Hans" data-i18n="zhName"></option><option value="en" data-i18n="enName"></option><option value="zh-Hant" data-i18n="zhTraditional"></option><option value="ja" data-i18n="jaName"></option><option value="ko" data-i18n="koName"></option><option value="fr" data-i18n="frName"></option><option value="de" data-i18n="deName"></option><option value="es" data-i18n="esName"></option></select></label><label><span data-i18n="pageMode"></span><select id="page-mode"><option value="replace" data-i18n="replaceMode"></option><option value="bilingual" data-i18n="bilingualMode"></option></select></label></div>
    <div class="button-row page-actions"><button id="translate-page" class="primary" data-i18n="translatePage"></button><button id="restore-page" class="secondary" data-i18n="restorePage"></button></div>
    <div class="page-status"><span class="status-pill" id="page-state"></span><p class="hint" id="page-progress" role="status" aria-live="polite"></p></div>
    <p id="page-error" class="notice" role="status"></p><p class="hint" data-i18n="pageDynamic"></p><p class="page-privacy hint" data-i18n="pagePrivacy"></p>
  </section>
  <details class="connection" id="connection"><summary><span><span class="connection-dot" id="connection-dot"></span><span id="connection-state"></span></span><span aria-hidden="true">⌄</span></summary><div class="connection-content"><h2 data-i18n="settings"></h2><form id="settings-form"><label><span data-i18n="server"></span><input id="server-url" type="url" required spellcheck="false" autocomplete="off"></label><label><span data-i18n="token"></span><div class="token-field"><input id="client-token" type="password" autocomplete="off" spellcheck="false" required><button type="button" id="show-token" class="token-show" aria-label="显示 / 隐藏配对码">◉</button></div></label><p class="hint" data-i18n="tokenHint"></p><button class="primary full" id="save-settings" type="submit" data-i18n="save"></button></form><p id="model-name" class="hint"></p><p class="hint" data-i18n="serverLocal"></p><a href="http://127.0.0.1:8787" id="setup-link" target="_blank" rel="noreferrer" data-i18n="setup"></a></div></details>
  <p id="action-message" class="notice" role="status" aria-live="polite"></p>
  <footer><p data-i18n="privacy"></p><div class="footer-links"><a href="https://www.youtube.com/" target="_blank" rel="noreferrer" data-i18n="openYoutube"></a><button id="open-settings" class="text-button" data-i18n="openSettings"></button><span>v2.0.0</span></div></footer>
</main></body></html>
